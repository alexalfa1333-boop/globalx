<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>GLOBAL X</title>
<meta name="description" content="GLOBAL X - Search the web. Made in Sri Lanka.">
<meta property="og:title" content="GLOBAL X">
<meta property="og:description" content="Search the web. Made in Sri Lanka.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%230052b4'/%3E%3Cstop offset='.5' stop-color='%236b1ff0'/%3E%3Cstop offset='1' stop-color='%2322b8a4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='50' y='82' font-size='95' font-weight='900' text-anchor='middle' font-family='Arial' fill='url(%23g)'%3EX%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--text:#202124;--muted:#5f6368;--line:#dfe1e5;--btn:#f1f3f4;--btn-h:#e4e6e8;--foot:#f2f2f2;--shadow:rgba(60,64,67,.25)}
body.dark{--bg:#121212;--text:#e8eaed;--muted:#a8adb3;--line:#3c4043;--btn:#2a2b2e;--btn-h:#38393d;--foot:#1a1a1a;--shadow:rgba(0,0,0,.6)}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;transition:background .2s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #6b1ff0;outline-offset:2px}

header{display:flex;justify-content:flex-end;align-items:center;gap:22px;padding:20px 28px}
header a{font-size:15px}
header a:hover{text-decoration:underline}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#0052b4,#6b1ff0);color:#fff;font-family:Lexend,sans-serif;font-weight:800;font-size:18px;border:0}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px 80px}
.logo{font-family:Lexend,"Segoe UI",Arial,sans-serif;font-weight:800;font-size:clamp(44px,11vw,104px);letter-spacing:-.02em;line-height:1;margin-bottom:44px;background:linear-gradient(90deg,#0052b4 0%,#6b1ff0 45%,#5a6fc0 70%,#22b8a4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.search{width:100%;max-width:700px;height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;border:1px solid var(--line);border-radius:32px;background:var(--bg);box-shadow:0 2px 8px var(--shadow);transition:box-shadow .2s}
.search:focus-within{box-shadow:0 4px 18px var(--shadow)}
.search svg{flex:none}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:17px;-webkit-appearance:none;appearance:none;border-radius:0}
.search input::placeholder{color:var(--muted)}
.ib{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center}
.ib:hover{background:var(--btn)}
.ib.on{background:#fde7e7}
.modes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px;max-width:700px}
.mode{height:36px;padding:0 16px;border:1px solid var(--line);border-radius:18px;background:transparent;font-size:14px;transition:background .15s}
.mode:hover{background:var(--btn)}
.mode.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.mode.ai{border:0;background:linear-gradient(90deg,#6b1ff0,#22b8a4);color:#fff;font-weight:600}
.mode.ai.active{outline:2px solid var(--text);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:28px}
.btn{height:44px;padding:0 26px;border:1px solid transparent;border-radius:22px;background:var(--btn);font-size:15px;transition:background .15s}
.btn:hover{background:var(--btn-h);border-color:var(--line)}

footer{background:var(--foot);color:var(--muted);font-size:15px}
.f1{padding:15px 32px;border-bottom:1px solid var(--line)}
.f2{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;padding:14px 32px}
.f2 div{display:flex;flex-wrap:wrap;align-items:center}
.f2 button{border:0;background:none;padding:4px 0;color:inherit}
.f2 button:hover{text-decoration:underline}
.f2 button+button::before{content:"•";display:inline-block;margin:0 14px;color:var(--muted);text-decoration:none}

dialog{margin:auto;width:min(92vw,520px);max-height:85vh;overflow:auto;padding:28px;border:0;border-radius:20px;background:var(--bg);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
dialog h2{font-family:Lexend,sans-serif;font-size:22px;margin-bottom:14px}
dialog p{line-height:1.65;font-size:15px;margin-bottom:12px;color:var(--muted)}
dialog label{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0;font-size:15px}
dialog select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.close{margin-top:10px}

/* splash intro */
body.splashing{overflow:hidden;height:100dvh}
#splash{position:fixed;inset:0;z-index:1000;background:#fff;display:grid;place-items:center;transition:opacity .6s ease,visibility .6s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
#splash>*{grid-area:1/1}
.globe{width:min(46vw,190px);height:auto;transition:opacity .45s,transform .45s}
.globe .m{fill:none;stroke:url(#sg);stroke-width:2.4;transform-box:fill-box;transform-origin:center;animation:spin 2.1s linear infinite}
.globe .m2{animation-delay:-.7s}
.globe .m3{animation-delay:-1.4s}
.globe .r{fill:none;stroke:url(#sg);stroke-width:2.4}
.globe .l{stroke:url(#sg);stroke-width:1.6;opacity:.7}
.globe .o{animation:orbit 2.1s linear infinite;transform-origin:60px 60px}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(0)}}
@keyframes orbit{to{transform:rotate(360deg)}}
.splash-logo{font-family:Lexend,"Segoe UI",Arial,sans-serif;font-weight:800;font-size:clamp(40px,12vw,96px);letter-spacing:-.02em;line-height:1;white-space:nowrap;background:linear-gradient(90deg,#0052b4 0%,#6b1ff0 45%,#5a6fc0 70%,#22b8a4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:scale(.9);transition:opacity .6s ease,transform .6s ease}
#splash.stage2 .globe{opacity:0;transform:scale(.6)}
#splash.stage2 .splash-logo{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.globe .m,.globe .o{animation:none}}

@media(max-width:600px){
header{padding:14px 16px;gap:16px}
.search{height:54px;padding:0 14px;gap:8px}
.f2 div{gap:2px 22px}
.f2 button+button::before{display:none}
.logo{margin-bottom:32px}
.f1,.f2{padding-left:18px;padding-right:18px}
}
</style>
</head>
<body id="body" class="splashing">

<div id="splash" aria-hidden="true">
  <svg class="globe" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0052b4"/><stop offset=".5" stop-color="#6b1ff0"/><stop offset="1" stop-color="#22b8a4"/>
      </linearGradient>
    </defs>
    <circle class="r" cx="60" cy="60" r="50"/>
    <line class="l" x1="10" y1="60" x2="110" y2="60"/>
    <line class="l" x1="20" y1="30" x2="100" y2="30"/>
    <line class="l" x1="20" y1="90" x2="100" y2="90"/>
    <ellipse class="m m1" cx="60" cy="60" rx="50" ry="50"/>
    <ellipse class="m m2" cx="60" cy="60" rx="50" ry="50"/>
    <ellipse class="m m3" cx="60" cy="60" rx="50" ry="50"/>
    <g class="o"><circle cx="60" cy="6" r="5" fill="#22b8a4"/></g>
  </svg>
  <div class="splash-logo">GLOBAL X</div>
</div>
<script>
try { if (sessionStorage.getItem("gx-splash")) { document.getElementById("splash").remove(); document.body.classList.remove("splashing"); } } catch (e) {}
</script>

<header>
  <a href="https://mail.google.com/" target="_blank" rel="noopener">Gmail</a>
  <a href="https://www.google.com/imghp" target="_blank" rel="noopener" id="imagesLink">Images</a>
  <button class="avatar" type="button" aria-label="Settings" onclick="openInfo('settings')">X</button>
</header>

<main>
  <div class="logo">GLOBAL X</div>

  <div class="search" role="search">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#70757a" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
    <input id="q" type="text" inputmode="search" enterkeyhint="search" placeholder="Search GLOBAL X or type a URL" aria-label="Search GLOBAL X or type a URL" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="ib" id="micBtn" type="button" title="Voice search" aria-label="Voice search" onclick="startVoice()">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3" fill="#4285f4"/><path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="#34a853" stroke-width="2" stroke-linecap="round"/><path d="M12 18v4" stroke="#ea4335" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="ib" type="button" title="Search by image" aria-label="Search by image" onclick="window.open('https://lens.google.com/','_blank','noopener')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8V6a3 3 0 0 1 3-3h2" stroke="#4285f4"/><path d="M16 3h2a3 3 0 0 1 3 3v2" stroke="#ea4335"/><path d="M21 16v2a3 3 0 0 1-3 3h-2" stroke="#fbbc04"/><path d="M8 21H6a3 3 0 0 1-3-3v-2" stroke="#34a853"/><circle cx="12" cy="12" r="3.5" fill="#4285f4" stroke="none"/></svg>
    </button>
  </div>

  <div class="modes" id="modes" role="group" aria-label="Search type">
    <button class="mode ai" type="button" data-mode="AI">✨ AI</button>
    <button class="mode active" type="button" data-mode="All" aria-pressed="true">All</button>
    <button class="mode" type="button" data-mode="Web">Web</button>
    <button class="mode" type="button" data-mode="Images">Images</button>
    <button class="mode" type="button" data-mode="Videos">Videos</button>
    <button class="mode" type="button" data-mode="News">News</button>
    <button class="mode" type="button" data-mode="Maps">Maps</button>
    <button class="mode" type="button" data-mode="Shopping">Shopping</button>
  </div>

  <div class="row">
    <button class="btn" type="button" onclick="doSearch()">Global X Search</button>
    <button class="btn" type="button" onclick="feelingLucky()">I'm Feeling Lucky</button>
  </div>
</main>

<footer>
  <div class="f1">Sri Lanka</div>
  <nav class="f2" aria-label="Footer">
    <div>
      <button type="button" onclick="openInfo('about')">About</button>
      <button type="button" onclick="openInfo('advertising')">Advertising</button>
      <button type="button" onclick="openInfo('business')">Business</button>
      <button type="button" onclick="openInfo('how')">How Search works</button>
    </div>
    <div>
      <button type="button" onclick="openInfo('privacy')">Privacy</button>
      <button type="button" onclick="openInfo('terms')">Terms</button>
      <button type="button" onclick="openInfo('settings')">Settings</button>
    </div>
  </nav>
</footer>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <h2 id="dlgTitle"></h2>
  <div id="dlgBody"></div>
  <button class="btn close" type="button" onclick="dlg.close()">Close</button>
</dialog>

<script>
const q = document.getElementById("q");
const dlg = document.getElementById("dlg");
const body = document.body;
const GOOGLE = "https://www.google.com/search?q=";
if (window.matchMedia("(max-width:600px)").matches) q.placeholder = "Search or type a URL";

/* ---------- splash intro ---------- */
(function () {
  const s = document.getElementById("splash");
  if (!s) return;
  let done = false;
  const t1 = setTimeout(() => s.classList.add("stage2"), 2000);
  const t2 = setTimeout(finish, 3600);
  function finish() {
    if (done) return;
    done = true;
    clearTimeout(t1); clearTimeout(t2);
    s.classList.add("out");
    document.body.classList.remove("splashing");
    setTimeout(() => s.remove(), 700);
    try { sessionStorage.setItem("gx-splash", "1"); } catch (e) {}
  }
  s.addEventListener("click", finish);
})();

/* ---------- saved settings ---------- */
function load(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
let theme = load("gx-theme", "light");
let voiceLang = load("gx-voice", "en-US");
function applyTheme() {
  body.classList.toggle("dark", theme === "dark");
  document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#121212" : "#ffffff";
}
applyTheme();

/* ---------- search ---------- */
function looksLikeUrl(t) {
  return !/\s/.test(t) && /^(https?:\/\/)?([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(t);
}
let mode = "All";
const MODE_URL = {
  All:      t => GOOGLE + t,
  Web:      t => GOOGLE + t + "&udm=14",
  AI:       t => GOOGLE + t + "&udm=50",
  Images:   t => GOOGLE + t + "&tbm=isch",
  Videos:   t => GOOGLE + t + "&tbm=vid",
  News:     t => GOOGLE + t + "&tbm=nws",
  Shopping: t => GOOGLE + t + "&tbm=shop",
  Maps:     t => "https://www.google.com/maps/search/?api=1&query=" + t
};
function setMode(m) {
  mode = m;
  document.querySelectorAll(".mode").forEach(b => {
    const on = b.dataset.mode === m;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on);
  });
}
document.getElementById("modes").addEventListener("click", e => {
  const b = e.target.closest(".mode");
  if (!b) return;
  setMode(b.dataset.mode);
  if (q.value.trim()) doSearch(); else q.focus();
});
function doSearch() {
  const t = q.value.trim();
  if (!t) { q.focus(); return; }
  if ((mode === "All" || mode === "Web") && looksLikeUrl(t)) {
    window.location.href = /^https?:\/\//i.test(t) ? t : "https://" + t;
    return;
  }
  window.location.href = MODE_URL[mode](encodeURIComponent(t));
}
function feelingLucky() {
  const t = q.value.trim() || "GLOBAL X Sri Lanka";
  window.location.href = GOOGLE + encodeURIComponent(t) + "&btnI=1";
}
q.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
document.getElementById("imagesLink").addEventListener("click", e => {
  const t = q.value.trim();
  if (t) { e.preventDefault(); window.open(GOOGLE + encodeURIComponent(t) + "&tbm=isch", "_blank", "noopener"); }
});

/* ---------- voice ---------- */
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("Voice search is not supported in this browser. Try Chrome or Edge."); return; }
  const btn = document.getElementById("micBtn");
  const rec = new SR();
  rec.lang = voiceLang;
  rec.interimResults = false;
  rec.onresult = e => { q.value = e.results[0][0].transcript; doSearch(); };
  rec.onerror = e => { alert(e.error === "not-allowed" ? "Allow microphone access to use voice search." : "Voice search failed. Try again."); };
  rec.onend = () => btn.classList.remove("on");
  try { rec.start(); btn.classList.add("on"); } catch (e) { btn.classList.remove("on"); }
}

/* ---------- footer pages ---------- */
const P = t => "<p>" + t + "</p>";
const pages = {
  about: ["About GLOBAL X",
    P("GLOBAL X is a search homepage made in Sri Lanka. Type a question or a web address and go straight to what you need.") +
    P("It supports voice search in English, Tamil and Sinhala, and image search through Google Lens.")],
  advertising: ["Advertising",
    P("GLOBAL X does not show ads today. If you want to advertise or sponsor GLOBAL X in the future, contact the founder through the Business page.")],
  business: ["Business",
    P("Building something for Sri Lankan users? GLOBAL X is open to partnerships, sponsorships and API collaborations.") +
    P("Business contact details will be published here soon.")],
  how: ["How Search works",
    P("When you press Global X Search, your words are sent to Google Search and the results open in your browser.") +
    P("If you type a web address such as example.com, GLOBAL X opens that site directly.") +
    P("The Images link and the Lens button open Google Images and Google Lens.")],
  privacy: ["Privacy",
    P("GLOBAL X does not keep an account for you and does not store your searches on its own servers.") +
    P("Your theme and voice-language choices are saved only in your own browser.") +
    P("Searches are handled by Google, so Google's privacy policy applies once you reach its results. Voice search uses your browser's speech service and asks for microphone permission first.")],
  terms: ["Terms",
    P("GLOBAL X is provided as is, without any guarantee that it will always be available or error free.") +
    P("Search results come from third parties. GLOBAL X is not responsible for the content of the websites you visit.") +
    P("By using this site you agree to use it lawfully.")],
  settings: ["Settings", ""]
};

function openInfo(key) {
  const [title, html] = pages[key];
  document.getElementById("dlgTitle").textContent = title;
  const box = document.getElementById("dlgBody");
  box.innerHTML = html;
  if (key === "settings") {
    box.innerHTML =
      '<label>Theme<select id="selTheme"><option value="light">Light</option><option value="dark">Dark</option></select></label>' +
      '<label>Voice language<select id="selVoice"><option value="en-US">English</option><option value="ta-LK">Tamil</option><option value="si-LK">Sinhala</option></select></label>';
    const st = document.getElementById("selTheme"), sv = document.getElementById("selVoice");
    st.value = theme; sv.value = voiceLang;
    st.onchange = () => { theme = st.value; save("gx-theme", theme); applyTheme(); };
    sv.onchange = () => { voiceLang = sv.value; save("gx-voice", voiceLang); };
  }
  dlg.showModal();
}
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
</script>
</body>
</html>
