<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<title>GLOBAL X</title>

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--bg:#fff;
--text:#202124;
--muted:#70757a;
--line:#ddd;
--panel:#f7f8fa;
--btn:#f1f3f4;
}

body.dark{
--bg:#121212;
--text:#eee;
--muted:#aaa;
--line:#444;
--panel:#1d1d1d;
--btn:#292929;
}

body{
background:var(--bg);
color:var(--text);
font-family:Arial,sans-serif;
min-height:100vh;
}

button,input{font:inherit;color:inherit}
button{cursor:pointer}

header{
height:75px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
border-bottom:1px solid var(--line);
}

.brand,.logo{
font-family:Lexend,sans-serif;
font-weight:800;
background:linear-gradient(90deg,#0052b4,#6b1ff0,#22b8a4);
color:transparent;
background-clip:text;
-webkit-background-clip:text;
}

.brand{font-size:25px}

.menuBtn{
border:0;
background:var(--btn);
width:48px;height:48px;
border-radius:15px;
font-size:25px;
}

.spacer{width:48px}

main{
min-height:calc(100vh - 140px);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:25px 16px;
}

.logo{
font-size:clamp(45px,12vw,95px);
margin-bottom:30px;
}

.search{
width:100%;
max-width:650px;
height:58px;
border:1px solid var(--line);
border-radius:30px;
display:flex;
align-items:center;
padding:0 18px;
}

.search input{
border:0;outline:0;
background:transparent;
flex:1;min-width:0;
font-size:16px;
}

.modes{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
margin:20px;
}

.mode{
padding:9px 15px;
border:1px solid var(--line);
border-radius:20px;
background:var(--bg);
}

.mode.active{
background:var(--text);
color:var(--bg);
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
}

.btn{
border:0;
background:var(--btn);
padding:13px 20px;
border-radius:25px;
}

footer{
text-align:center;
padding:20px;
color:var(--muted);
}

/* MENU */

.overlay{
position:fixed;
inset:0;
background:#0008;
z-index:10;
display:none;
}

.overlay.show{display:block}

.sidebar{
position:fixed;
z-index:11;
top:0;left:-310px;
height:100%;
width:min(290px,85vw);
background:var(--bg);
padding:22px;
transition:.3s;
box-shadow:5px 0 20px #0002;
}

.sidebar.show{left:0}

.sideTitle{
font-family:Lexend;
font-size:21px;
margin:20px 0;
}

.sideItem{
width:100%;
padding:15px;
text-align:left;
border:0;
background:var(--panel);
border-radius:12px;
margin:6px 0;
font-size:15px;
}

.closeSide{
float:right;
border:0;
background:none;
font-size:25px;
}

/* PAGES */

.page{
display:none;
max-width:950px;
width:100%;
margin:auto;
padding:25px 15px;
}

.page.show{display:block}

.pageTitle{
font-family:Lexend;
font-size:25px;
margin-bottom:20px;
}

.card{
background:var(--panel);
border:1px solid var(--line);
padding:18px;
border-radius:15px;
margin-bottom:15px;
}

@media(max-width:600px){
.pageTitle{font-size:21px}
.brand{font-size:21px}
}
</style>
</head>

<body>

<header>
<button class="menuBtn" onclick="openMenu()">☰</button>
<div class="brand">GLOBAL X</div>
<div class="spacer"></div>
</header>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<aside class="sidebar" id="sidebar">
<button class="closeSide" onclick="closeMenu()">×</button>
<div class="sideTitle">GLOBAL X</div>
<button class="sideItem" onclick="showPage('home')">⌂ Home</button>
<button class="sideItem" onclick="showPage('about')">ⓘ About</button>
<button class="sideItem" onclick="toggleTheme()">🌙 Dark / Light Mode</button>
</aside>

<!-- HOME -->

<main id="home">
<div class="logo">GLOBAL X</div>

<div class="search">
<span>⌕</span>
<input id="q" placeholder="Search GLOBAL X or type a URL">
</div>

<div class="modes" id="modes">
<button class="mode active" data-mode="All">All</button>
<button class="mode" data-mode="Web">Web</button>
<button class="mode" data-mode="AI">AI</button>
<button class="mode" data-mode="Images">Images</button>
<button class="mode" data-mode="Videos">Videos</button>
<button class="mode" data-mode="News">News</button>
<button class="mode" data-mode="Maps">Maps</button>
<button class="mode" data-mode="Shopping">Shopping</button>
</div>

<div class="actions">
<button class="btn" onclick="doSearch()">Global X Search</button>
<button class="btn" onclick="feelingLucky()">I'm Feeling Lucky</button>
</div>
</main>

<!-- ABOUT -->

<section class="page" id="about">
<h2 class="pageTitle">About GLOBAL X</h2>
<div class="card">
GLOBAL X - Search the web. Made in Sri Lanka 🇱🇰
</div>
</section>

<footer>GLOBAL X | Made in Sri Lanka 🇱🇰</footer>

<script>

const $=id=>document.getElementById(id);
let currentMode="All";

// ========================================
// MENU
// ========================================

function openMenu(){
$("sidebar").classList.add("show");
$("overlay").classList.add("show");
}

function closeMenu(){
$("sidebar").classList.remove("show");
$("overlay").classList.remove("show");
}

function showPage(page){

closeMenu();

$("home").style.display=page==="home"?"flex":"none";

document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("show");
});

if(page!=="home"){
$(page).classList.add("show");
}

}

function toggleTheme(){

document.body.classList.toggle("dark");

try{
localStorage.setItem(
"gx-theme",
document.body.classList.contains("dark")?"dark":"light"
);
}catch(e){}

}

try{
if(localStorage.getItem("gx-theme")==="dark"){
document.body.classList.add("dark");
}
}catch(e){}

// ========================================
// SEARCH
// ========================================

const searchURLs={

All:q=>"https://www.google.com/search?q="+q,
Web:q=>"https://www.google.com/search?q="+q+"&udm=14",
AI:q=>"https://www.google.com/search?q="+q+"&udm=50",
Images:q=>"https://www.google.com/search?q="+q+"&tbm=isch",
Videos:q=>"https://www.google.com/search?q="+q+"&tbm=vid",
News:q=>"https://www.google.com/search?q="+q+"&tbm=nws",
Shopping:q=>"https://www.google.com/search?q="+q+"&tbm=shop",
Maps:q=>"https://www.google.com/maps/search/?api=1&query="+q

};

document.querySelectorAll(".mode").forEach(button=>{

button.addEventListener("click",()=>{

currentMode=button.dataset.mode;

document.querySelectorAll(".mode").forEach(b=>{
b.classList.toggle("active",b===button);
});

if($("q").value.trim())doSearch();

});

});

function looksLikeUrl(text){

return !/\s/.test(text)&&
/^(https?:\/\/)?([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(text);

}

function doSearch(){

const text=$("q").value.trim();

if(!text)return;

if((currentMode==="All"||currentMode==="Web")&&looksLikeUrl(text)){

location.href=/^https?:\/\//i.test(text)
?text
:"https://"+text;

return;

}

location.href=searchURLs[currentMode](
encodeURIComponent(text)
);

}

function feelingLucky(){

const text=$("q").value.trim()||"GLOBAL X Sri Lanka";

location.href=
"https://www.google.com/search?q="+
encodeURIComponent(text)+"&btnI=1";

}

$("q").addEventListener("keydown",e=>{

if(e.key==="Enter")doSearch();

});

</script>

</body>
</html>
